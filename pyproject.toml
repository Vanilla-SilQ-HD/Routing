[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "W", "RUF"]
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["build", "report", "service_networks"]

[tool.coverage.run]
branch = true
source = ["scripts", "routing"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-rules"
version = "2.0.0"
description = "Validated selective-routing rule sets for sing-box and AWG Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["idna>=3.10,<4"]

[tool.setuptools.packages.find]
include = ["routing*", "scripts*"]

[tool.mypy]
strict = true
files = ["scripts", "routing"]
explicit_package_bases = true
ignore_missing_imports = true
