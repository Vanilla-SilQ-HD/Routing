<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Routing — выборочная маршрутизация</title>
  <desc id="desc">Заблокированные ресурсы через VPN, остальные — напрямую. Тринадцать источников и шесть наборов правил.</desc>
  <defs>
    <style>
      .overline{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:2.6px;fill:#7890ad}
      .brand{font:650 54px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:4px;fill:#f1f6fd}
      .subtitle{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#a8bad0}
      .stats{font:400 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#8fa6c0}
      .card-label{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:1.2px}
      .card-value{font:650 30px system-ui,-apple-system,"Segoe UI",sans-serif}
      .card-note{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#8fa6c0}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="#0c1525" stroke="#26374e"/>
  <path d="M20 1H198" stroke="#42caa0" stroke-width="3"/>
  <g transform="translate(64 44)">
    <text x="0" y="0" class="overline">SELECTIVE TRAFFIC CONTROL</text>
    <rect x="0" y="28" width="46" height="46" rx="12" fill="#183149"/>
    <path d="M13 42h20M13 51h14M13 60h20" fill="none" stroke="#68dbc0" stroke-width="3" stroke-linecap="round"/>
    <text x="66" y="71" class="brand">ROUTING</text>
    <text x="0" y="113" class="subtitle">Выборочная маршрутизация</text>
    <text x="0" y="177" class="stats">13 источников  ·  6 наборов  ·  обновление 4 раза в сутки</text>
  </g>
  <g transform="translate(700 68)">
    <rect width="200" height="104" rx="14" fill="#102c29" stroke="#28574e"/>
    <circle cx="22" cy="23" r="4" fill="#48d3a7"/>
    <text x="34" y="27" class="card-label" fill="#8ee2c8">ЗАБЛОКИРОВАННОЕ</text>
    <text x="20" y="66" class="card-value" fill="#d8f8ec">VPN</text>
    <text x="20" y="89" class="card-note">только нужные ресурсы</text>
    <rect x="230" width="200" height="104" rx="14" fill="#12283f" stroke="#315574"/>
    <circle cx="252" cy="23" r="4" fill="#6fb6fa"/>
    <text x="264" y="27" class="card-label" fill="#a4cef7">ОСТАЛЬНОЕ</text>
    <text x="250" y="66" class="card-value" fill="#e0efff">Direct</text>
    <text x="250" y="89" class="card-note">без изменений</text>
    <text x="0" y="153" class="stats">домены  ·  сети  ·  IP  ·  исключения</text>
  </g>
</svg>
