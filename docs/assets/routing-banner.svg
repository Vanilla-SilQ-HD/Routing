<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">ROUTING — выборочная маршрутизация трафика</title>
  <desc id="description">Заблокированные и недоступные ресурсы направляются через VPN, остальной трафик — напрямую. Для sing-box и AWG Manager.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e192b"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#223d54"/>
      <stop offset="0.5" stop-color="#243248"/>
      <stop offset="1" stop-color="#254362"/>
    </linearGradient>
    <linearGradient id="vpnCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102e2e"/>
      <stop offset="1" stop-color="#10252b"/>
    </linearGradient>
    <linearGradient id="directCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142d44"/>
      <stop offset="1" stop-color="#12263c"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#296a85" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#296a85" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7da9d0" opacity="0.17"/>
    </pattern>
    <clipPath id="canvas">
      <rect x="1" y="1" width="1198" height="278" rx="21"/>
    </clipPath>
    <style>
      .font { font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; }
      .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 2.4px; }
      .brand { font-size: 57px; font-weight: 800; letter-spacing: 2px; }
      .subtitle { font-size: 20px; font-weight: 500; }
      .small { font-size: 14px; font-weight: 400; }
      .label { font-size: 10px; font-weight: 750; letter-spacing: 1.25px; }
      .card-title { font-size: 37px; font-weight: 750; letter-spacing: -1px; }
      .card-note { font-size: 12px; font-weight: 400; }
      .footer { font-size: 12px; font-weight: 450; }
    </style>
  </defs>

  <!-- The background stays understated so the routing decisions carry the meaning. -->
  <rect x="1" y="1" width="1198" height="278" rx="21" fill="url(#background)" stroke="url(#edge)" stroke-width="1.5"/>
  <g clip-path="url(#canvas)">
    <ellipse cx="960" cy="100" rx="340" ry="220" fill="url(#ambient)"/>
    <rect x="573" y="0" width="620" height="280" fill="url(#dots)" opacity="0.62"/>
  </g>

  <!-- Brand and product positioning. -->
  <g class="font">
    <circle cx="62" cy="42" r="3" fill="#5fe4bd"/>
    <text x="75" y="46" class="eyebrow" fill="#91aec9">ВЫБОРОЧНОЕ УПРАВЛЕНИЕ ТРАФИКОМ</text>

    <rect x="60" y="78" width="54" height="54" rx="15" fill="#173449" stroke="#31556b" stroke-width="1.2"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M73 105h11c6 0 7-10 13-10h4" stroke="#59e2b8" stroke-width="3.3"/>
      <path d="M73 105h12c6 0 7 10 13 10h3" stroke="#70baff" stroke-width="3.3"/>
      <circle cx="73" cy="105" r="3.5" fill="#d5fff1" stroke="none"/>
      <circle cx="101" cy="95" r="3.5" fill="#59e2b8" stroke="none"/>
      <circle cx="101" cy="115" r="3.5" fill="#70baff" stroke="none"/>
    </g>

    <text x="133" y="126" class="brand" fill="#f6f9ff">ROUTING</text>
    <text x="60" y="173" class="subtitle" fill="#d7e4f2">Выборочная маршрутизация</text>
    <text x="60" y="198" class="small" fill="#8ea9c4">для sing-box и AWG Manager</text>

    <circle cx="64" cy="239" r="3" fill="#5bdebc"/>
    <text x="75" y="244" class="footer" fill="#9db4cb">13 источников</text>
    <circle cx="206" cy="239" r="2" fill="#48617a"/>
    <text x="220" y="244" class="footer" fill="#9db4cb">Обновление 4 раза в сутки</text>
  </g>

  <path d="M562 57v166" stroke="#2c4056" stroke-width="1"/>

  <!-- The two legible outcomes are the main information graphic. -->
  <g class="font">
    <text x="597" y="46" class="eyebrow" fill="#8fa8be">КАК МАРШРУТИЗИРУЕТСЯ ТРАФИК</text>
    <path d="M596 60h537" stroke="#243a50" stroke-width="1"/>

    <rect x="596" y="74" width="258" height="143" rx="16" fill="url(#vpnCard)" stroke="#276153" stroke-width="1.3"/>
    <circle cx="622" cy="101" r="4.2" fill="#57e1b4"/>
    <text x="635" y="105" class="label" fill="#7beac8">НЕДОСТУПНЫЕ РЕСУРСЫ</text>
    <text x="620" y="158" class="card-title" fill="#e6fff7">VPN</text>
    <text x="620" y="189" class="card-note" fill="#a3cbbf">Через VPN-туннель</text>
    <g transform="translate(805 153)" stroke="#65e2bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
      <path d="M-17-9h13l10 9-10 9h-13"/>
      <path d="M-6-9V9" opacity="0.4"/>
    </g>

    <rect x="872" y="74" width="272" height="143" rx="16" fill="url(#directCard)" stroke="#335a79" stroke-width="1.3"/>
    <circle cx="899" cy="101" r="4.2" fill="#7abfff"/>
    <text x="912" y="105" class="label" fill="#9dcefa">ОСТАЛЬНОЙ ТРАФИК</text>
    <text x="896" y="158" class="card-title" fill="#f2f8ff">Direct</text>
    <text x="896" y="189" class="card-note" fill="#acc8e0">Напрямую, без VPN</text>
    <g transform="translate(1097 153)" stroke="#82c5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75">
      <path d="M-18 0h25"/>
      <path d="M-2-10L8 0-2 10"/>
    </g>

    <circle cx="602" cy="241" r="2.8" fill="#4cdeb0"/>
    <text x="613" y="245" class="footer" fill="#8eaac2">Домены</text>
    <circle cx="695" cy="241" r="2.8" fill="#4cdeb0" opacity="0.7"/>
    <text x="706" y="245" class="footer" fill="#8eaac2">Сети</text>
    <circle cx="776" cy="241" r="2.8" fill="#4cdeb0" opacity="0.55"/>
    <text x="787" y="245" class="footer" fill="#8eaac2">IP</text>
    <circle cx="826" cy="241" r="2.8" fill="#4cdeb0" opacity="0.45"/>
    <text x="837" y="245" class="footer" fill="#8eaac2">Исключения</text>
    <text x="1142" y="245" class="footer" text-anchor="end" fill="#5e7d9b">НАПРЯМУЮ ПО УМОЛЧАНИЮ</text>
  </g>
</svg>
