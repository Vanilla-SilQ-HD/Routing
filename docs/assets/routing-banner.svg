<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Routing — выборочная маршрутизация</title>
  <desc id="desc">Одиннадцать источников формируют четыре набора правил. Недоступные ресурсы идут через VPN, остальные напрямую.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 54px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f8ff;letter-spacing:5px}
      .subtitle{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9eb1cc}
      .label{font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e6eefb}
      .small{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#8ea6c4}
      .node{fill:#13243b;stroke:#2b4566;stroke-width:1.5}
      .vpn{fill:#34d399}.direct{fill:#60a5fa}
    </style>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <path d="M0 245H1200" stroke="#1c314d"/>
  <circle cx="1080" cy="30" r="170" fill="#123457" opacity=".32"/>
  <circle cx="780" cy="310" r="170" fill="#0d5a4b" opacity=".16"/>
  <g transform="translate(58 58)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#route)" filter="url(#glow)"/>
    <path d="M13 17h25M13 27h17M13 37h25" stroke="#07111f" stroke-width="4" stroke-linecap="round"/>
    <text x="72" y="42" class="title">ROUTING</text>
    <text x="2" y="96" class="subtitle">Точная маршрутизация без лишнего VPN</text>
    <text x="2" y="139" class="small">11 источников  ·  4 набора  ·  автообновление 4 раза в сутки</text>
    <g transform="translate(0 178)">
      <rect width="170" height="34" rx="17" fill="#12352f" stroke="#246554"/>
      <circle cx="18" cy="17" r="5" class="vpn"/>
      <text x="33" y="22" class="small" fill="#b9f4df">Только нужное — VPN</text>
      <rect x="184" width="190" height="34" rx="17" fill="#132c48" stroke="#315c86"/>
      <circle cx="202" cy="17" r="5" class="direct"/>
      <text x="217" y="22" class="small" fill="#c5e0ff">Остальное — Direct</text>
    </g>
  </g>
  <g transform="translate(625 55)">
    <path d="M86 95H190M268 95H305M383 72H445M383 118H445" stroke="#3b5b7d" stroke-width="2"/>
    <path d="M190 82l12 13-12 13M433 59l12 13-12 13M433 105l12 13-12 13" fill="none" stroke="#5e83aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="61" width="88" height="68" rx="16" class="node"/>
    <text x="44" y="90" text-anchor="middle" class="label">11</text>
    <text x="44" y="112" text-anchor="middle" class="small">источников</text>
    <rect x="190" y="61" width="80" height="68" rx="16" class="node"/>
    <text x="230" y="90" text-anchor="middle" class="label">4</text>
    <text x="230" y="112" text-anchor="middle" class="small">набора</text>
    <rect x="305" y="61" width="80" height="68" rx="16" class="node"/>
    <text x="345" y="90" text-anchor="middle" class="label">SRS</text>
    <text x="345" y="112" text-anchor="middle" class="small">sing-box</text>
    <rect x="445" y="28" width="110" height="56" rx="16" fill="#12352f" stroke="#246554"/>
    <text x="500" y="62" text-anchor="middle" class="label" fill="#b9f4df">VPN</text>
    <rect x="445" y="112" width="110" height="56" rx="16" fill="#132c48" stroke="#315c86"/>
    <text x="500" y="146" text-anchor="middle" class="label" fill="#c5e0ff">Direct</text>
    <text x="0" y="165" class="small">домены · сети · IP · исключения</text>
  </g>
</svg>
