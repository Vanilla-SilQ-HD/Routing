name: Build selective VPN rule sets

on:
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: 'After reviewing an intentional large change, start a new baseline'
        type: boolean
        default: false
      allow_large_change:
        description: 'Stage a large coverage growth as a candidate pre-release for review'
        type: boolean
        default: false
  schedule:
    - cron: '35 0,6,12,18 * * *'
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'routing/**'
      - 'schemas/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'routing/**'
      - 'schemas/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: selective-vpn-list-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check scripts tests routing
      - name: Strict type checking
        run: python -m mypy
      - name: Validate configuration schemas
        run: python scripts/validate_config.py
      - name: Security lint
        run: python -m bandit -q -r scripts --severity-level medium
      - name: Install pinned compiler for integration tests
        run: python scripts/install_tools.py
      - name: Validate example sing-box configs
        run: |
          .tools/sing-box check --config examples/singbox-router.json
          .tools/sing-box check --config examples/singbox-client.json
      - name: Unit and integration tests with branch coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage xml
          python -m coverage report --fail-under=75
      - name: Save coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install hashed dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Restore source cache for conditional downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: cache/sources
          key: sources-${{ hashFiles('config/*.json') }}-${{ github.run_id }}
          restore-keys: |
            sources-${{ hashFiles('config/*.json') }}-
            sources-
      - name: Install pinned official sing-box compiler
        run: python scripts/install_tools.py
      - name: Test routing semantics and failure guards
        run: python -m unittest discover -s tests -v
      - name: Restore last successful comparison baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: ${{ github.ref_name }}
          RESET_BASELINE: ${{ inputs.reset_baseline || false }}
        run: python scripts/load_baseline.py
      - name: Fetch, filter, compile and validate
        shell: bash
        run: |
          args=()
          if [ -f previous/manifest.json ]; then
            args+=(--previous previous/manifest.json)
          fi
          if [ "${ALLOW_LARGE_CHANGE}" = "true" ]; then
            args+=(--allow-large-change)
          fi
          python scripts/build.py --output dist "${args[@]}"
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_change || false }}
      - name: Validate artifacts against output schemas
        run: python scripts/validate_outputs.py dist
      - name: Measure sing-box memory per profile (advisory)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          profiles = {"full": "dist/blocked-domains.srs", "compact": "dist/blocked-domains-core.srs"}
          results = {}
          for name, path in profiles.items():
              out = subprocess.run([sys.executable, "scripts/measure_memory.py", path, "--seconds", "6"],
                                   capture_output=True, text=True)
              for line in out.stderr.splitlines():
                  if "max_rss_bytes" in line:
                      results[name] = json.loads(line[line.index("{"):])["max_rss_bytes"]
          if not results:
              print("Memory measurement unavailable", file=sys.stderr)
              sys.exit(0)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          limit = 64 * 1024 * 1024
          lines = ["## sing-box memory (RSS)\n", "| Profile | Max RSS |", "| --- | ---: |"]
          for name, rss in results.items():
              lines.append(f"| {name} | {rss / 1024 / 1024:.1f} МБ |")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          if results.get("compact", 0) > limit:
              print(f"::warning::Compact profile RSS {results['compact'] / 1024 / 1024:.1f} МБ exceeds the 64 МБ advisory limit")
          print(json.dumps(results))
          PY
      - name: Save complete reviewable result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selective-vpn-rules
          path: |
            dist/
            cache/sources/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
      - name: Save baseline for subsequent runs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rules-manifest
          path: dist/manifest.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
    outputs:
      stable: ${{ steps.baseline.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download the validated artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selective-vpn-rules
          path: incoming
      - name: Verify files, upload a draft and publish it as Latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESET_BASELINE: ${{ inputs.reset_baseline || false }}
        run: python scripts/publish_release.py --input incoming/dist --output release
      - id: baseline
        name: Expose whether this run produced a stable (Latest) release
        run: |
          python - <<'PY'
          import json, os
          baseline = json.load(open("incoming/dist/manifest.json", encoding="utf-8"))["validation"]["baseline"]
          stable = "false" if baseline == "large-change-candidate" else "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"stable={stable}\n")
          PY

  release-retention:
    name: Keep only recent published releases
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Keep Latest and five newer releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py retention --keep 5 --apply

  publish-data:
    name: Mirror rules and baseline to the data branch
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Download the validated build from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selective-vpn-rules
          path: incoming
      - name: Publish manifest, diffs and SRS into the orphan data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init data-branch
          cd data-branch
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --orphan data
          cp ../incoming/dist/manifest.json .
          cp ../incoming/dist/domain-changes.json .
          cp ../incoming/dist/catalog.json .
          cp ../incoming/dist/presets.user.json .
          for name in blocked-domains blocked-domains-core blocked-domains-smart blocked-services-ip \
                      blocked-registry-ip blocked-registry-ip-cidr routing-direct-exceptions; do
            cp "../incoming/dist/${name}.json" .
            cp "../incoming/dist/${name}.srs" .
          done
          printf '# Routing data branch\n\nMachine-generated mirror of the latest published rule sets.\nDo not edit by hand; the build workflow overwrites this branch content.\n\njsDelivr mirror example:\nhttps://cdn.jsdelivr.net/gh/%s@data/blocked-domains.srs\n' "${GITHUB_REPOSITORY}" > README.md
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Rules from run ${GITHUB_RUN_ID}"
            git push --force origin data
          fi

  monitor:
    name: Measure external availability
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.stable == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
    env:
      PYTHONUTF8: '1'
      RUN_MONITOR: ${{ github.event_name == 'workflow_dispatch' || github.schedule == '17 3 * * *' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download the validated build from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selective-vpn-rules
          path: incoming
      - name: Run limited availability checks
        run: python scripts/monitor.py --output incoming/dist/monitoring.json --html incoming/dist/monitoring.html
      - name: Save monitoring report for Pages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routing-monitoring
          path: |
            incoming/dist/monitoring.json
            incoming/dist/monitoring.html
            incoming/dist/stale-candidates.json
          if-no-files-found: error
          retention-days: 2

  pages:
    name: Publish Routing Dashboard
    needs: [publish, monitor]
    if: always() && github.ref == 'refs/heads/main' && needs.publish.result == 'success' && needs.publish.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the validated dashboard from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selective-vpn-rules
          path: incoming
      - name: Download the monitoring report from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: routing-monitoring
          path: incoming/dist
      - name: Prepare the static site
        run: |
          mkdir _site
          cp incoming/dist/report.html _site/index.html
          cp incoming/dist/status.json _site/status.json
          cp incoming/dist/updated.json _site/updated.json
          cp incoming/dist/manifest.json _site/manifest.json
          cp incoming/dist/domain-changes.json _site/domain-changes.json
          cp incoming/dist/catalog.json _site/catalog.json
          cp incoming/dist/presets.user.json _site/presets.user.json
          cp incoming/dist/blocked-domains.srs _site/blocked-domains.srs
          cp incoming/dist/blocked-domains-core.srs _site/blocked-domains-core.srs
          cp incoming/dist/blocked-domains-core.txt _site/blocked-domains-core.txt
          cp incoming/dist/blocked-domains-smart.srs _site/blocked-domains-smart.srs
          cp incoming/dist/blocked-services-ip.srs _site/blocked-services-ip.srs
          cp incoming/dist/blocked-registry-ip.srs _site/blocked-registry-ip.srs
          cp incoming/dist/blocked-registry-ip-cidr.srs _site/blocked-registry-ip-cidr.srs
          cp incoming/dist/routing-direct-exceptions.srs _site/routing-direct-exceptions.srs
          if [ -f incoming/dist/monitoring.json ]; then
            cp incoming/dist/monitoring.json _site/monitoring.json
            cp incoming/dist/monitoring.html _site/monitoring.html
            if [ -f incoming/dist/stale-candidates.json ]; then
              cp incoming/dist/stale-candidates.json _site/stale-candidates.json
            fi
          else
            echo '{"schema_version":1,"generated_at":null,"provider":"Globalping","vpn_measurement":"not_performed","automatic_route_changes":false,"history":[],"unavailable":true}' > _site/monitoring.json
            printf '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Routing · Мониторинг</title><body style="background:#08111f;color:#e7f0fc;font:16px system-ui;max-width:800px;margin:60px auto;padding:0 20px"><h1>Мониторинг временно недоступен</h1><p>Внешняя проверка не выполнилась в этом запуске. Маршруты и наборы правил опубликованы штатно.</p><p><a style="color:#70b7ff" href="index.html">Routing Dashboard</a></p></body></html>' > _site/monitoring.html
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
