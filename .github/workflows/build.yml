name: Build selective VPN rule sets

on:
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: 'After reviewing an intentional large change, start a new baseline'
        type: boolean
        default: false
  schedule:
    - cron: '35 0,6,12,18 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: selective-vpn-list-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install hashed dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Test routing semantics and failure guards
        run: python -m unittest discover -s tests -v
      - name: Install pinned official sing-box compiler
        run: python scripts/install_tools.py
      - name: Restore last successful comparison baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: ${{ github.ref_name }}
          RESET_BASELINE: ${{ inputs.reset_baseline || false }}
        run: python scripts/load_baseline.py
      - name: Fetch, filter, compile and validate
        shell: bash
        run: |
          args=()
          if [ -f previous/manifest.json ]; then
            args+=(--previous previous/manifest.json)
          fi
          python scripts/build.py --output dist "${args[@]}"
      - name: Save complete reviewable result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selective-vpn-rules
          path: |
            dist/
            cache/sources/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
      - name: Save baseline for subsequent runs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rules-manifest
          path: dist/manifest.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download the validated artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selective-vpn-rules
          path: incoming
      - name: Verify files, upload a draft and publish it as Latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESET_BASELINE: ${{ inputs.reset_baseline || false }}
        run: python scripts/publish_release.py --input incoming/dist --output release

  pages:
    name: Publish Routing Dashboard
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the validated dashboard from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selective-vpn-rules
          path: incoming
      - name: Prepare the static site
        run: |
          mkdir _site
          cp incoming/dist/report.html _site/index.html
          cp incoming/dist/status.json _site/status.json
          cp incoming/dist/updated.json _site/updated.json
          cp incoming/dist/manifest.json _site/manifest.json
          cp incoming/dist/domain-changes.json _site/domain-changes.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
