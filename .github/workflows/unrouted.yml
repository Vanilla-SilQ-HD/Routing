name: Prepare candidate from unrouted issue

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  candidate:
    # Run on open, or only when the 'unrouted' label itself is added.
    if: >-
      contains(github.event.issue.labels.*.name, 'unrouted') &&
      (github.event.action == 'opened' || github.event.label.name == 'unrouted')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install hashed dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Validate resource and create candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/issue_candidate.py --comment
