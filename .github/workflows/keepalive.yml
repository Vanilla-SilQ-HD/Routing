name: Keep scheduled builds alive

# GitHub disables scheduled workflows in public repositories after 60 days of
# repository inactivity. This weekly job re-enables the build workflow if the
# last commit is getting old, so unattended rule updates keep running.

on:
  schedule:
    - cron: '42 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-enable the build workflow if the repository is inactive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Routing-Keepalive/1",
          }

          def call(method, url, data=None):
              request = urllib.request.Request(
                  url, data=json.dumps(data).encode() if data is not None else None,
                  headers=headers, method=method)
              with urllib.request.build_opener().open(request, timeout=30) as response:
                  payload = response.read()
              return json.loads(payload) if payload else None

          base = f"https://api.github.com/repos/{repo}"
          commit = call("GET", base + "/commits?per_page=1")[0]
          last = dt.datetime.fromisoformat(commit["commit"]["committer"]["date"].replace("Z", "+00:00"))
          age_days = (dt.datetime.now(dt.UTC) - last).days
          print(f"Last commit age: {age_days} days")
          if age_days < 50:
              print("Repository is active; nothing to do.")
              raise SystemExit(0)
          state = call("GET", base + "/actions/workflows/build.yml")
          if state.get("state") != "enabled":
              call("PUT", base + "/actions/workflows/build.yml/enable")
              print("build.yml was disabled and has been re-enabled.")
          else:
              print("build.yml is enabled; scheduled runs will continue.")
          PY
